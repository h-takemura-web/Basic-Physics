<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放物運動シミュレーター</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --accent-blue: #0040ff; /* 速度ベクトル成分 vx / 水平射影 */
            --accent-red: #ff0000;  /* 速度ベクトル成分 vy / 垂直射影 */
            --accent-green: #00a82d; /* 速度ベクトル合成分 v */
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        h1 { font-size: 1.4rem; margin: 10px 0; color: #333; }
        .layout-container { display: flex; flex-direction: row; gap: 20px; padding: 10px; align-items: flex-start; justify-content: center; width: 95%; }
        canvas { background: #fff; border: 2px solid #dee2e6; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); width: 320px; display: flex; flex-direction: column; gap: 12px; }
        .control-group { border-bottom: 1px solid #eee; padding-bottom: 8px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 3px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .value-display { float: right; color: #333; font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: bold; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .main-btns { display: flex; gap: 8px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        #startBtn { background: #333; color: white; }
        #pauseBtn { background: #f39c12; color: white; }
        #clearBtn { background: #6c757d; color: white; }
        .legend { font-size: 0.8rem; color: #444; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #000; }
    </style>
</head>
<body>

    <h1>🚀 放物運動シミュレーター</h1>

    <div class="layout-container">
        <canvas id="canvas"></canvas>

        <div class="panel">
            <div class="control-group">
                <label>初速度 v_0 <span class="value-display"><span id="v0Val">25</span> m/s</span></label>
                <input type="range" id="v0" min="5" max="60" value="25">
            </div>
            <div class="control-group">
                <label>投射角 θ <span class="value-display"><span id="angleVal">45</span>°</span></label>
                <input type="range" id="angle" min="-90" max="90" value="45">
            </div>
            <div class="control-group">
                <label>ストロボ間隔 Δt <span class="value-display"><span id="dtVal">0.3</span> s</span></label>
                <input type="range" id="dt" min="0.1" max="1.0" step="0.1" value="0.3">
            </div>
            <div class="control-group">
                <label>重力加速度 g <span class="value-display"><span id="gVal">9.8</span> m/s²</span></label>
                <input type="range" id="g" min="0" max="20" step="0.1" value="9.8">
            </div>

            <div class="btn-group">
                <div class="main-btns">
                    <button id="startBtn">投射開始</button>
                    <button id="pauseBtn">ポーズ</button>
                </div>
                <button id="clearBtn">リセット</button>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="dot" style="background: #fff; border: 2px solid #000;"></div> 物体（合成運動）</div>
                <div class="legend-item"><div class="dot" style="background: var(--accent-blue); border: none;"></div> 水平射影（等速直線運動）</div>
                <div class="legend-item"><div class="dot" style="background: var(--accent-red); border: none;"></div> 垂直射影（鉛直投げ上げ）</div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 650;
    const scale = 8; 
    const marginX = 80;
    const projY = 250; 
    const groundY = canvas.height - 40;

    let t = 0;
    let isRunning = false;
    let history = []; 
    let lastStrobeTime = -1;

    // 立体感のある白いボールを描画
    function drawBall(x, y, radius, isGhost = false) {
        ctx.save();
        if (!isGhost) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 6;
        }

        const grad = ctx.createRadialGradient(x - radius*0.3, y - radius*0.3, radius*0.05, x, y, radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, '#e0e0e0');
        grad.addColorStop(0.8, '#a0a0a0'); 
        grad.addColorStop(1, '#777777');

        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = isGhost ? 1 : 2.5;
        ctx.stroke();

        // 模様（ボールらしさの演出）
        ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x - radius*1.2, y, radius, -Math.PI/3, Math.PI/3); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + radius*1.2, y, radius, Math.PI * 0.67, Math.PI * 1.33); ctx.stroke();
        ctx.restore();
    }

    function drawArrow(x, y, vx, vy, color) {
        if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) return;
        const arrowScale = 2.5;
        const headlen = 10;
        const tx = x + vx * arrowScale;
        const ty = y - vy * arrowScale;
        const angle = Math.atan2(-vy, vx);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tx, ty);
        ctx.lineTo(tx - headlen * Math.cos(angle - Math.PI / 6), ty - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(tx - headlen * Math.cos(angle + Math.PI / 6), ty - headlen * Math.sin(angle + Math.PI / 6));
        ctx.fill();
    }

    function render() {
        if (!isRunning && t > 0) return; 

        const v0 = parseFloat(document.getElementById('v0').value);
        const theta = parseFloat(document.getElementById('angle').value) * Math.PI / 180;
        const g = parseFloat(document.getElementById('g').value);
        const dt = parseFloat(document.getElementById('dt').value);

        const vx = v0 * Math.cos(theta);
        const vy = v0 * Math.sin(theta) - g * t;
        const x = vx * t;
        const y = v0 * Math.sin(theta) * t - 0.5 * g * t * t;
        const px = marginX + x * scale;
        const py = projY - y * scale;

        if (py > groundY) isRunning = false;
        
        if (isRunning && (t - lastStrobeTime >= dt)) {
            if (py <= groundY) {
                history.push({px, py});
                lastStrobeTime = t;
            }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#eee'; ctx.beginPath(); ctx.moveTo(marginX-30, projY); ctx.lineTo(canvas.width, projY); ctx.stroke();
        ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

        // 過去の射影（青と赤に戻した）
        history.forEach(p => {
            // 水平の影（青）
            ctx.fillStyle = 'rgba(0, 64, 255, 0.6)';
            ctx.beginPath(); ctx.arc(p.px, projY, 5, 0, Math.PI*2); ctx.fill();
            // 垂直の影（赤）
            ctx.fillStyle = 'rgba(255, 0, 0, 0.6)';
            ctx.beginPath(); ctx.arc(marginX, p.py, 5, 0, Math.PI*2); ctx.fill();
            
            ctx.globalAlpha = 0.3; drawBall(p.px, p.py, 8, true); ctx.globalAlpha = 1.0;
        });

        if (t > 0) {
            ctx.setLineDash([5, 5]); ctx.strokeStyle = '#aaa';
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, projY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(marginX, py); ctx.stroke();
            ctx.setLineDash([]);

            drawArrow(px, py, vx, vy, 'var(--accent-green)');
            drawArrow(px, projY, vx, 0, 'var(--accent-blue)');
            drawArrow(marginX, py, 0, vy, 'var(--accent-red)');

            // 現在の射影インジケーター（不透明な青と赤）
            ctx.fillStyle = 'var(--accent-blue)';
            ctx.beginPath(); ctx.arc(px, projY, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'var(--accent-red)';
            ctx.beginPath(); ctx.arc(marginX, py, 9, 0, Math.PI*2); ctx.fill();
            
            drawBall(px, py, 14);
        }

        if (isRunning) { t += 0.016; requestAnimationFrame(render); }
    }

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    startBtn.onclick = () => {
        if (t === 0 || !isRunning) {
            if (t === 0) { history = []; lastStrobeTime = -0.0001; }
            isRunning = true;
            render();
            pauseBtn.innerText = "ポーズ";
        }
    };

    pauseBtn.onclick = () => {
        if (t > 0) {
            isRunning = !isRunning;
            pauseBtn.innerText = isRunning ? "ポーズ" : "再開";
            if (isRunning) render();
        }
    };

    document.getElementById('clearBtn').onclick = () => {
        t = 0; isRunning = false; history = [];
        pauseBtn.innerText = "ポーズ";
        render();
    };

    document.querySelectorAll('input[type="range"]').forEach(el => {
        el.oninput = (e) => {
            document.getElementById(e.target.id + 'Val').innerText = e.target.value;
            if (!isRunning) { t = 0; history = []; render(); }
        };
    });
    render();
</script>
</body>
</html>
